name: Frame Labeler CI

on:
  push:
    branches:
      - main
    paths:
      - frame-labeler/**
      - .github/workflows/frame-labeler-ci.yml
  pull_request:
    paths:
      - frame-labeler/**
      - .github/workflows/frame-labeler-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-labeler-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frame-labeler

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: frame-labeler/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run type checking
        run: uv run mypy

      - name: Build package
        run: uv build

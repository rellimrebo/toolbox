name: Label Preview CI

on:
  push:
    branches:
      - main
    paths:
      - label-preview/**
      - .github/workflows/label-preview-ci.yml
  pull_request:
    paths:
      - label-preview/**
      - .github/workflows/label-preview-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: label-preview-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: label-preview

jobs:
  verify:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x"
          - "1.26.x"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: label-preview/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build executable
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/label-preview ./cmd/label-preview

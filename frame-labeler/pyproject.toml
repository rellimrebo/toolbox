[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "frame-labeler"
version = "0.1.0"
description = "Local image and video bounding-box annotation tool"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "av>=18,<19",
  "pillow>=11,<13",
  "pyside6>=6.10,<6.12",
]

[project.scripts]
frame-labeler = "frame_labeler.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-qt>=4.5,<5",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frame_labeler"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["frame_labeler"]
